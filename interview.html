      <svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span>Search concepts and subjects</span><kbd>/</kbd>
    </button>
    <button class="kb-iconbtn" type="button" data-kb-theme title="Toggle theme (T)" aria-label="Toggle theme">◑</button>

  </div>

<main class="kb-main kb-main--interview">
  <div class="kb-section-head" style="margin-top:0">
    <h2>Interview mode</h2>
    <span class="kb-section-note">Pick a track, cram the concepts that carry the most weight, then drill the question bank.</span>
    <span class="kb-section-actions">
      <label style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-muted)">
        Minimum relevance
        <select data-kb-rel>
          <option value="5">5 only</option>
          <option value="4" selected>4 and up</option>
          <option value="3">3 and up</option>
          <option value="0">Everything</option>
        </select>
      </label>
    </span>
  </div>

  <div class="kb-tracks" data-kb-tracks></div>

  <div class="kb-drill">
    <section>
      <div class="kb-section-head" style="margin-top:26px">
        <h2>Question drill</h2>
        <span class="kb-section-actions">
          <select data-kb-diff></select>
          <button class="kb-btn kb-btn--ghost" type="button" data-kb-shuffle>Shuffle</button>
        </span>
      </div>
      <div class="kb-drillcard" data-kb-drill></div>
      <p style="margin-top:10px;font-size:11.5px;color:var(--ink-faint)">
        <kbd>space</kbd> reveal / next · <kbd>1</kbd> got it · <kbd>2</kbd> missed it · <kbd>n</kbd> skip
      </p>
    </section>

    <aside>
      <div class="kb-section-head" style="margin-top:26px">
        <h2>Cram sheet</h2>
      </div>
      <p style="margin:0 0 12px;font-size:11.5px;color:var(--ink-faint)" data-kb-cram-count></p>
      <div class="kb-cram" data-kb-cram></div>
    </aside>
  </div>
